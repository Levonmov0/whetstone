<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Whetstone</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Accent shades for Claude's suggestions, made from the theme so a repo's own accent carries through. */
  :root {
    --tint: color-mix(in srgb, var(--ws-accent) 13%, var(--ws-surface));
    --wash: color-mix(in srgb, var(--ws-accent) 8%, var(--ws-surface));
    --ink: color-mix(in srgb, var(--ws-accent) 80%, var(--ws-text));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ws-bg); color: var(--ws-text); font-family: var(--ws-font);
    display: flex; flex-direction: column; overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: var(--ws-space); color: var(--ws-muted); font-size: 14px; }
  header button { background: none; border: 0; color: var(--ws-muted); font: inherit; text-decoration: underline; padding: 4px; }
  header .badge {
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px;
    background: var(--tint); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none;
  }
  header .badge[hidden] { display: none; }
  .badge .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ws-accent); }
  /* Nothing to check, only Claude's sure matches: a quiet outline, no dot. */
  header .badge.quiet { background: transparent; border: 1px solid color-mix(in srgb, var(--ws-muted) 50%, transparent); color: var(--ws-muted); font-weight: 500; }
  .badge.quiet .dot { display: none; }
  main { flex: 1; display: flex; flex-direction: column; padding: 0 var(--ws-space); min-height: 0; }
  .card {
    flex: 1; min-height: 0; overflow-y: auto; background: var(--ws-surface); border-radius: var(--ws-radius);
    padding: calc(var(--ws-space) * 1.25); touch-action: pan-y; user-select: none; -webkit-user-select: none;
    transition: transform 0.2s ease, opacity 0.2s ease; position: relative;
  }
  .card.dragging { transition: none; }
  .stamp {
    position: absolute; top: 12px; right: 12px; font-weight: 800; font-size: 22px; letter-spacing: 0.08em; opacity: 0;
    text-transform: uppercase; border: 3px solid currentColor; border-radius: 8px; padding: 2px 10px; transform: rotate(-8deg);
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 10px 18px; border-radius: 999px; color: var(--ws-surface); font-weight: 700; font-size: 16px;
    opacity: 0; transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .card, .toast { transition: none; } }
  .output { font-size: 18px; line-height: 1.45; }
  .input { font-size: 15px; line-height: 1.45; margin-top: 8px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .none { color: var(--ws-muted); font-style: italic; }
  .list { margin: 0; padding-left: 1.2em; }
  .items { display: grid; gap: 10px; }
  .field.inline { display: flex; gap: 10px; align-items: baseline; }
  .field.inline .field-name { margin: 0; flex: none; min-width: 5.5em; }
  .item { border-left: 3px solid color-mix(in srgb, var(--ws-muted) 40%, transparent); padding: 2px 0 2px 12px; }
  .item .field:last-child, .output .field:last-child { margin-bottom: 0; }
  .field { margin: 0 0 12px; }
  .field-name { display: block; color: var(--ws-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; color: var(--ws-muted); margin: 0; }
  .caught { color: var(--ws-bad); font-size: 13px; margin: 0 0 12px; }
  .about { font-size: 15px; line-height: 1.45; margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--ws-muted) 12%, transparent); }
  details { margin-top: 18px; border-top: 1px solid color-mix(in srgb, var(--ws-muted) 30%, transparent); padding-top: 10px; }
  summary { color: var(--ws-accent); cursor: pointer; padding: 6px 0; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: var(--ws-space) 0; }
  .actions button, .sheet button, .deck-end button {
    min-height: 52px; border-radius: var(--ws-radius); border: 0; font: inherit; font-size: 17px; font-weight: 600;
    background: var(--ws-surface); color: var(--ws-text);
  }
  .actions .bad { color: var(--ws-bad); }
  .actions .good { color: var(--ws-good); }
  button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ws-accent); outline-offset: 2px; }
  .message { margin: auto; text-align: center; max-width: 28em; line-height: 1.5; padding: var(--ws-space); }
  .message h1 { font-size: 22px; }
  .sheet-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); display: flex; align-items: flex-end; }
  .sheet {
    width: 100%; max-height: 92%; overflow-y: auto; background: var(--ws-bg); border-radius: var(--ws-radius) var(--ws-radius) 0 0;
    padding: var(--ws-space); padding-bottom: calc(var(--ws-space) + env(safe-area-inset-bottom));
  }
  .sheet h2 { font-size: 18px; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ws-muted) 50%, transparent);
    background: transparent; color: var(--ws-text); font: inherit; font-size: 15px;
  }
  .chip[aria-pressed="true"] { background: var(--ws-bad); border-color: var(--ws-bad); color: var(--ws-surface); }
  textarea, input[type="text"] {
    width: 100%; border-radius: var(--ws-radius); border: 1px solid color-mix(in srgb, var(--ws-muted) 50%, transparent);
    background: var(--ws-surface); color: var(--ws-text); font: inherit; font-size: 17px; padding: 12px;
  }
  textarea { min-height: 11em; resize: vertical; line-height: 1.45; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 12px; }
  .sheet .save { background: var(--ws-bad); color: var(--ws-surface); }
  .error { color: var(--ws-bad); min-height: 1.4em; font-size: 14px; }
  /* Claude's matches: its suggestions use the accent, never the bad colour a grader's own pick gets. */
  .ask-title { margin: 0 0 4px; font-size: 22px; line-height: 1.25; }
  .ask-lede { margin: 0 0 14px; color: var(--ws-muted); font-size: 15px; line-height: 1.45; }
  .match {
    flex: 1; min-height: 0; overflow-y: auto; background: var(--ws-surface); border-radius: var(--ws-radius);
    padding: calc(var(--ws-space) * 1.25); display: flex; flex-direction: column; gap: 16px;
  }
  .match .field-name { margin-bottom: 4px; }
  .match .about { margin: 0; }
  .match .about .field-name { margin-bottom: 2px; }
  .match .chips-label { margin-bottom: 6px; }
  .match-note { margin: 0; font-size: 18px; line-height: 1.45; }
  .match-why { margin: 0; font-size: 15px; line-height: 1.45; }
  .suggested-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggested {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px;
    border: 1.5px solid var(--ws-accent); background: var(--wash); color: var(--ink); font-size: 15px; font-weight: 600;
  }
  .match-error { margin: 8px 0 0; font-weight: 600; }
  .answers { padding: 12px 0 16px; }
  .answers button { font-size: 16px; }
  .answers .different { line-height: 1.15; }
  .answers .yes, .sheet .count, .deck-end .primary { background: var(--ws-accent); color: var(--ws-surface); }
  .pick h2 { margin-bottom: 4px; }
  .sheet-note { margin: 0 0 12px; color: var(--ws-muted); font-size: 14px; line-height: 1.4; }
  .pick .chip {
    min-height: 40px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ws-muted) 50%, transparent);
    background: transparent; font-size: 15px; font-weight: 400;
  }
  .pick .chip[aria-pressed="true"] { background: var(--ws-accent); border-color: var(--ws-accent); color: var(--ws-surface); }
  .pick .error { margin: 0; }
  .pick .sheet-actions { margin-top: 8px; }
  .deck-end { margin: auto 0; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: var(--ws-space) 0; }
  .deck-end-text { text-align: center; }
  .deck-end h1 { font-size: 22px; margin: 0 0 8px; }
  .deck-end-text p { margin: 0 auto; max-width: 28em; line-height: 1.5; }
  .pending { background: var(--ws-surface); border-radius: var(--ws-radius); padding: var(--ws-space); display: flex; flex-direction: column; gap: 12px; }
  .pending-row { display: flex; gap: 10px; align-items: baseline; }
  .pending-note { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pending-chip { flex: none; font-size: 13px; color: var(--ink); font-weight: 600; }
  .deck-end .sheet-actions { margin-top: 6px; }
  .hint { margin: 0; text-align: center; color: var(--ws-muted); font-size: 13px; line-height: 1.4; }
  .sure-toggle { margin-top: auto; border-top: 1px solid color-mix(in srgb, var(--ws-muted) 30%, transparent); padding-top: 10px; }
  .sure-toggle > button { background: none; border: 0; padding: 6px 0; color: var(--ws-accent); font: inherit; font-size: 15px; text-align: left; }
  .sure-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .nothing .sure-list { gap: 0; margin-top: 0; }
  .sure-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--ws-muted) 12%, transparent); }
  .nothing .sure-row:last-child { border-bottom: 0; }
  .sure-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; }
  .sure-text > span { display: block; }
  .sure-note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sure-status { color: var(--ink); }
  .sure-row.undone .sure-status { color: var(--ws-muted); }
  .sure-row > button {
    min-height: 44px; min-width: 64px; padding: 0 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--ws-muted) 50%, transparent);
    background: transparent; color: var(--ws-text); font: inherit; font-size: 14px;
  }
  .nothing { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
  .nothing .error { margin: -8px 0 0; }
  .nothing-text { text-align: center; padding: 28px 0 8px; }
  .nothing-text h1 { font-size: 22px; margin: 0 0 8px; }
  .nothing-text p { margin: 0 auto; max-width: 28em; line-height: 1.5; }
  .sure-box { background: var(--ws-surface); border-radius: var(--ws-radius); padding: var(--ws-space) calc(var(--ws-space) * 1.25); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .sure-box h2 { font-size: 15px; margin: 0 0 2px; }
  .sure-box p { margin: 0 0 8px; color: var(--ws-muted); font-size: 14px; line-height: 1.4; }
  .nothing .back { margin-top: auto; margin-bottom: var(--ws-space); }
  .nothing .back button {
    width: 100%; min-height: 52px; border-radius: var(--ws-radius); border: 0; font: inherit; font-size: 17px; font-weight: 600;
    background: var(--ws-surface); color: var(--ws-good);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <button id="back" type="button" hidden>‹ Back to cards</button>
  <span id="progress"></span>
  <button id="badge" class="badge" type="button" hidden><span class="dot" aria-hidden="true"></span><span id="badge-text"></span></button>
  <button id="rename" type="button" hidden>Not you?</button>
</header>
<main id="main"></main>
<p class="sr-only" aria-live="polite" id="status"></p>
<div class="toast" id="toast" aria-hidden="true"></div>
<script>
"use strict";
// The token arrives after the # so it is never sent in a URL. Keep it for this tab, then drop it from the address bar and history.
const params = new URLSearchParams(location.hash.slice(1));
let token = params.get("t");
try {
  if (token) sessionStorage.setItem("ws-token", token);
  else token = sessionStorage.getItem("ws-token");
} catch {}
if (location.hash) history.replaceState(null, "", location.pathname);

const main = document.getElementById("main");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const renameButton = document.getElementById("rename");
const backButton = document.getElementById("back");
const badge = document.getElementById("badge");
let grader = null;
try { grader = localStorage.getItem("ws-grader"); } catch {}
let cards = [];
let reasons = [];
let total = 0;
let busy = false;
let matches = [];       // Claude's matches of this grader's notes that wait for their answer
let matchReasons = [];  // every reason a check stands for: what the Different chip sheet offers
let sure = [];          // Claude's sure matches of this grader's notes: they count already, and each can be undone
let sureOpen = false;   // the "matched on its own" list on the matching screen starts collapsed
let screen = "cards";   // cards, deck-end or matching
let later = false;      // the grader put the matches off: they wait behind the badge, the deck end doesn't ask again
let checking = null;    // on the matching screen: the items left, and what the answers did

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function showMessage(title, text, ...extra) {
  progress.textContent = "";
  main.replaceChildren(el("div", { class: "message" }, el("h1", {}, title), el("p", {}, text), ...extra));
}

function askName() {
  renameButton.hidden = true;
  const input = el("input", { type: "text", id: "name", autocomplete: "name", autocapitalize: "words", enterkeyhint: "go" });
  const form = el("form", { class: "message" },
    el("h1", {}, "Who's grading?"),
    el("p", {}, "Your name goes on every swipe, so disagreements can be settled."),
    el("label", { for: "name", class: "sr-only" }, "Your name"), input,
    el("div", { class: "actions", style: "grid-template-columns: 1fr" }, el("button", { type: "submit", class: "good" }, "Start")));
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    grader = name;
    try { localStorage.setItem("ws-grader", name); } catch {}
    load();
  });
  progress.textContent = "";
  main.replaceChildren(form);
  input.focus();
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    // A header can't carry most names (Łukasz, 陈), so the name travels URL-encoded.
    headers: { "Authorization": `Bearer ${token}`, "X-Grader": encodeURIComponent(grader), "Content-Type": "application/json", ...(options.headers || {}) },
  });
  const body = await response.json().catch(() => ({}));
  return { ok: response.ok, status: response.status, body };
}

function tokenProblem() {
  showMessage("Scan the QR code again", "This link's token is missing, wrong or expired. The server makes a new one each time it starts.");
}

async function load() {
  if (!token) return tokenProblem();
  if (!grader) return askName();
  renameButton.hidden = false;
  showMessage("Loading…", "");
  let result;
  try { result = await api("/api/cards"); } catch { return showMessage("Can't reach the server", "Check that this phone is on the same network as the laptop, and that the server is still running.", retryButton()); }
  if (result.status === 401) return tokenProblem();
  if (!result.ok) return showMessage("No cards yet", result.body.error || "Something went wrong.", retryButton());
  cards = result.body.cards;
  reasons = result.body.reasons;
  total = cards.length;
  await loadMatches();
  render();
}

// The badge is a quiet extra: when the matches can't be fetched, grading goes on and the badge keeps what it had.
async function loadMatches() {
  try {
    const result = await api("/api/matches");
    if (!result.ok) return;
    matches = result.body.items;
    matchReasons = result.body.reasons;
    sure = result.body.sure;
  } catch { return; }
  updateBadge();
}

// Asks pending: "N to check". Nothing to check but Claude's sure matches: a quiet "N matched", the way to undo them.
function updateBadge() {
  const quiet = !matches.length;
  const kept = sure.filter((item) => !item.undone).length;
  document.getElementById("badge-text").textContent = quiet ? `${kept} matched` : `${matches.length} to check`;
  badge.classList.toggle("quiet", quiet);
  if (quiet) badge.setAttribute("aria-label", `${kept} matched by Claude, nothing to check`); else badge.removeAttribute("aria-label");
  badge.hidden = !(matches.length || sure.length) || screen !== "cards";
}

function retryButton(label = "Try again") {
  return el("div", { class: "actions", style: "grid-template-columns: 1fr" }, el("button", { type: "button", onclick: load }, label));
}

// Any JSON, as something a person reads: labelled fields, text with its line breaks, lists as separate blocks.
function renderValue(value, depth = 0) {
  if (value === null || value === undefined || value === "" ||
      (typeof value === "object" && !Object.keys(value).length)) return el("span", { class: "none" }, "none");
  if (typeof value !== "object") return el("span", { class: "text" }, String(value));
  if (depth > 4) return el("pre", {}, JSON.stringify(value, null, 2));  // deeper than anyone reads as fields
  if (Array.isArray(value)) {
    if (value.every((item) => item === null || typeof item !== "object")) {
      return el("ul", { class: "list" }, ...value.map((item) => el("li", {}, renderValue(item, depth + 1))));
    }
    return el("div", { class: "items" }, ...value.map((item) => el("div", { class: "item" }, renderValue(item, depth + 1))));
  }
  return el("div", {}, ...Object.entries(value).map(([key, item]) => {
    // A short one-line value sits beside its label, so a list of small facts stays compact.
    const short = (item === null || typeof item !== "object") && String(item ?? "").length <= 24 && !String(item ?? "").includes("\n");
    return el("div", { class: short ? "field inline" : "field" }, el("span", { class: "field-name" }, label(key)), renderValue(item, depth + 1));
  }));
}

function label(key) {
  // recentAsks, recent_asks -> recent asks
  return key.replace(/_/g, " ").replace(/([a-z0-9])([A-Z])/g, "$1 $2").toLowerCase();
}

function renderOutput(output) {
  return el("div", { class: "output" }, renderValue(output));
}

function render() {
  screen = "cards";
  checking = null;
  backButton.hidden = true;
  renameButton.hidden = false;
  updateBadge();
  if (!cards.length) {
    if (matches.length && !later) return deckEnd();
    progress.textContent = "";
    return showMessage("All graded", "Thanks. New cards show up here after the next check run.", retryButton("Check for new cards"));
  }
  const card = cards[0];
  progress.textContent = `${total - cards.length + 1} of ${total}`;
  const stamp = el("span", { class: "stamp", "aria-hidden": "true" });
  const node = el("article", { class: "card", "aria-label": "Output to grade" },
    stamp,
    card.caught_by.length ? el("p", { class: "caught" }, `Already caught by: ${card.caught_by.join(", ")}`) : "",
    card.about ? el("p", { class: "about text" }, card.about) : "",
    renderOutput(card.output),
    el("details", {}, el("summary", {}, "Show input"), el("div", { class: "input" }, renderValue(card.input))));
  const actions = el("div", { class: "actions" },
    el("button", { type: "button", class: "bad", onclick: () => decide("bad") }, "✕ Bad"),
    el("button", { type: "button", onclick: () => decide("skip") }, "Skip"),
    el("button", { type: "button", class: "good", onclick: () => decide("good") }, "✓ Good"));
  main.replaceChildren(node, el("p", { class: "error", role: "alert", id: "card-error" }), actions);
  enableSwipe(node, stamp);
}

function enableSwipe(node, stamp) {
  // Move and release are watched on the window, so a finger that leaves the card still finishes the swipe.
  let start = null;
  const threshold = () => Math.min(120, window.innerWidth * 0.28);
  const move = (event) => {
    if (!start || event.pointerId !== start.id) return;
    const dx = event.clientX - start.x, dy = event.clientY - start.y;
    const up = dy < 0 && Math.abs(dy) > Math.abs(dx);
    node.style.transform = up ? `translateY(${dy}px)` : `translateX(${dx}px) rotate(${dx / 25}deg)`;
    const verdict = direction(dx, dy, threshold());
    stamp.textContent = verdict === "good" ? "Good" : verdict === "bad" ? "Bad" : verdict === "skip" ? "Skip" : "";
    stamp.style.color = verdict === "good" ? "var(--ws-good)" : verdict === "bad" ? "var(--ws-bad)" : "var(--ws-muted)";
    stamp.style.opacity = verdict ? 1 : 0;
  };
  const end = (event) => {
    if (!start || event.pointerId !== start.id) return;
    const verdict = event.type === "pointerup" ? direction(event.clientX - start.x, event.clientY - start.y, threshold()) : null;
    start = null;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("pointercancel", end);
    node.classList.remove("dragging");
    // A swipe that counts keeps the card where it was let go, stamped, until the save lands and it flies off.
    if (verdict) return decide(verdict);
    node.style.transform = "";
    stamp.style.opacity = 0;
  };
  node.addEventListener("pointerdown", (event) => {
    if (start || event.target.closest("summary")) return;
    start = { x: event.clientX, y: event.clientY, id: event.pointerId };
    node.classList.add("dragging");
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
  });
}

function direction(dx, dy, threshold) {
  if (-dy > threshold && -dy > Math.abs(dx)) return "skip";
  if (dx > threshold) return "good";
  if (dx < -threshold) return "bad";
  return null;
}

function decide(verdict) {
  if (busy) return;
  const card = cards[0];
  // A problem a code check already catches needs no words from the grader. A judge's catch still asks: the
  // grader's own reason is what the judge is measured against.
  const byCode = card.caught_by.filter((name) => !(card.judges || []).includes(name));
  if (verdict === "bad" && !byCode.length) return askWhy(card);
  send(card, { verdict, reasons: [], note: "" });
}

function askWhy(card) {
  const picked = new Set();
  const chips = reasons.map((reason) => {
    const chip = el("button", { type: "button", class: "chip", "aria-pressed": "false" }, reason);
    chip.addEventListener("click", () => {
      if (picked.has(reason)) picked.delete(reason); else picked.add(reason);
      chip.setAttribute("aria-pressed", String(picked.has(reason)));
    });
    return chip;
  });
  const note = el("textarea", { id: "note", rows: "7", autocapitalize: "sentences", spellcheck: "true", maxlength: "10000",
    placeholder: "What's wrong with it? Type, or tap the mic on your keyboard and talk it through." });
  const error = el("p", { class: "error", role: "alert" });
  const close = () => { backdrop.remove(); document.removeEventListener("keydown", onKey); restore(); };
  const onKey = (event) => { if (event.key === "Escape") close(); };
  const save = el("button", { type: "button", class: "save" }, "Save as bad");
  save.addEventListener("click", async () => {
    if (busy) return;  // a double tap must not save twice
    if (!picked.size && !note.value.trim()) { error.textContent = "Pick a reason or say what's wrong."; return; }
    const sent = await send(card, { verdict: "bad", reasons: [...picked], note: note.value.trim() }, error);
    if (sent) close();
  });
  const sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "why" },
    el("h2", { id: "why" }, "Why is it bad?"),
    chips.length ? el("div", { class: "chips" }, ...chips) : "",
    el("label", { for: "note", class: "sr-only" }, "Note"), note, error,
    el("div", { class: "sheet-actions" }, el("button", { type: "button", onclick: close }, "Cancel"), save));
  const backdrop = el("div", { class: "sheet-backdrop" }, sheet);
  backdrop.addEventListener("click", (event) => { if (event.target === backdrop) close(); });
  document.addEventListener("keydown", onKey);
  document.body.append(backdrop);
  (chips[0] || note).focus();
}

const LOOK = {
  good: { stamp: "Good", color: "var(--ws-good)", off: "translateX(130vw) rotate(18deg)", toast: "✓ Saved as good" },
  bad: { stamp: "Bad", color: "var(--ws-bad)", off: "translateX(-130vw) rotate(-18deg)", toast: "✕ Saved as bad" },
  skip: { stamp: "Skip", color: "var(--ws-muted)", off: "translateY(-130vh)", toast: "Skipped" },
};

// The saved card leaves the way it was swiped, so a swipe (or a button) is seen to have counted.
function flyOff(verdict) {
  const node = document.querySelector(".card"), stamp = node?.querySelector(".stamp");
  if (!node || !stamp) return Promise.resolve();
  const look = LOOK[verdict];
  stamp.textContent = look.stamp;
  stamp.style.color = look.color;
  stamp.style.opacity = 1;
  node.style.transform = look.off;
  node.style.opacity = 0;
  return new Promise((done) => setTimeout(done, 220));
}

// A swipe that didn't save, or a reason sheet that was cancelled, puts the card back.
function restore() {
  const node = document.querySelector(".card"), stamp = node?.querySelector(".stamp");
  if (node) node.style.transform = "";
  if (stamp) stamp.style.opacity = 0;
}

let toastTimer;
function showToast(text, color) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.background = color;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
}

async function send(card, swipe, errorNode) {
  busy = true;
  try {
    const result = await api("/api/swipes", { method: "POST", body: JSON.stringify({ card_id: card.card_id, grader, ...swipe }) });
    if (result.status === 401) { tokenProblem(); return false; }
    if (!result.ok) restore();
    // A newer check replaced the deck: these cards are gone, so fetch the new ones.
    if (result.status === 409 || (result.status === 400 && /in the current deck/.test(result.body.error || ""))) {
      document.querySelector(".sheet-backdrop")?.remove();
      status.textContent = "New cards arrived; loading them.";
      load();
      return false;
    }
    if (!result.ok) {
      const text = result.body.error || "Couldn't save that swipe.";
      (errorNode || document.getElementById("card-error")).textContent = text;
      return false;
    }
    status.textContent = `Saved as ${swipe.verdict}.`;
    await flyOff(swipe.verdict);
    showToast(LOOK[swipe.verdict].toast, LOOK[swipe.verdict].color);
    cards.shift();
    // Claude matches notes while the grader swipes, so the badge is refreshed after every swipe; the last one
    // waits for it, so the deck end knows whether anything is left to check.
    if (cards.length) loadMatches(); else await loadMatches();
    render();
    return true;
  } catch {
    restore();
    (errorNode || document.getElementById("card-error")).textContent = "Couldn't reach the server. Try again.";
    return false;
  } finally {
    busy = false;
  }
}

function deckEnd() {
  screen = "deck-end";
  updateBadge();
  progress.textContent = total ? `${total} of ${total} graded` : "";
  const n = matches.length;
  const rows = matches.map((item) => el("div", { class: "pending-row" },
    el("span", { class: "pending-note" }, `“${item.note}”`),
    el("span", { class: "pending-chip" }, item.reasons.length === 1 ? `${item.reasons[0]}?` : `${item.reasons.length} checks?`)));
  main.replaceChildren(el("div", { class: "deck-end" },
    el("div", { class: "deck-end-text" },
      el("h1", {}, "All graded. One more minute?"),
      el("p", {}, n === 1
        ? "One of your notes sounds like a check we already have. Say yes and that swipe counts toward the check."
        : `${n} of your notes sound like checks we already have. Say yes and those swipes count toward the check.`)),
    el("div", { class: "pending" }, ...rows),
    el("div", { class: "sheet-actions" },
      el("button", { type: "button", onclick: putOff }, "Later"),
      el("button", { type: "button", class: "primary", onclick: openMatching }, "Check them")),
    el("p", { class: "hint" }, "Later keeps them. They wait behind the badge until you're back.")));
}

function putOff() {
  later = true;
  render();
}

function openMatching() {
  screen = "matching";
  checking = { left: [...matches], total: matches.length, counted: 0, kept: 0 };
  sureOpen = false;
  renameButton.hidden = true;
  backButton.hidden = false;
  updateBadge();
  if (!matches.length) return nothingToCheck();
  renderMatch();
}

function nothingToCheck() {
  progress.textContent = "";
  const error = el("p", { class: "error", role: "alert" });
  main.replaceChildren(el("div", { class: "nothing" },
    el("div", { class: "nothing-text" },
      el("h1", {}, "Nothing to check"),
      el("p", {}, "Every note you wrote is either matched or kept as an idea for a new check.")),
    sure.length ? el("section", { class: "sure-box", "aria-labelledby": "sure-title" },
      el("h2", { id: "sure-title" }, "Claude matched these on its own"),
      el("p", {}, "They already count. Undo any that are wrong."),
      sureList(error, nothingToCheck)) : "",
    error,
    el("div", { class: "back" }, el("button", { type: "button", onclick: backToCards }, "Back to cards"))));
}

// The grader's sure matches, each with Undo, or Redo once undone. rerender redraws the screen the list is on.
function sureList(errorNode, rerender) {
  return el("div", { class: "sure-list" }, ...sure.map((item) => el("div", { class: item.undone ? "sure-row undone" : "sure-row" },
    el("div", { class: "sure-text" },
      el("span", { class: "sure-note" }, `“${item.note}”`),
      el("span", { class: "sure-status" }, item.undone ? "Undone. Counts as before." : `→ ${item.reasons.join(" + ")}`)),
    el("button", { type: "button", onclick: () => toggleSure(item, errorNode, rerender) }, item.undone ? "Redo" : "Undo"))));
}

async function toggleSure(item, errorNode, rerender) {
  if (busy) return;  // a double tap must not undo twice
  busy = true;
  try {
    const result = await api(`/api/matches/${encodeURIComponent(item.id)}`, { method: "POST", body: JSON.stringify({ answer: item.undone ? "redo" : "undo" }) });
    if (result.status === 401) return tokenProblem();
    if (result.status === 409 || result.status === 404) {
      // Swiped again, or its check is gone: it no longer counts either way, so it leaves the list.
      sure = sure.filter((other) => other !== item);
      status.textContent = "That one is out of date, so it was removed.";
    } else if (!result.ok) {
      errorNode.textContent = result.status === 400 ? result.body.error : "Couldn’t save, try again.";
      return;
    } else {
      item.undone = !item.undone;
      status.textContent = item.undone ? "Undone. Counts as before." : `Counts as ${item.reasons.join(" + ")} again.`;
    }
    rerender();
  } catch {
    errorNode.textContent = "Couldn’t save, try again.";
  } finally {
    busy = false;
  }
}

function renderMatch() {
  const item = checking.left[0];
  if (!item) return allChecked();
  progress.textContent = `${checking.total - checking.left.length + 1} of ${checking.total}`;
  const error = el("p", { class: "error match-error", role: "alert" });
  main.replaceChildren(
    el("h1", { class: "ask-title" }, "Is this what you meant?"),
    el("p", { class: "ask-lede" }, "Some of what you said is already covered by a check. If it matches, your swipe counts toward that check."),
    el("article", { class: "match", "aria-label": "Matched note" },
      el("div", {}, el("span", { class: "field-name" }, "You said"), el("p", { class: "match-note text" }, `“${item.note}”`)),
      el("div", { class: "about" }, el("span", { class: "field-name" }, "About this card"), el("span", { class: "text" }, item.excerpt)),
      el("div", {}, el("span", { class: "field-name chips-label" }, "Claude thinks it's"),
        el("div", { class: "suggested-chips" }, ...item.reasons.map((reason) => el("span", { class: "suggested" }, reason)))),
      el("div", {}, el("span", { class: "field-name" }, "Why"), el("p", { class: "match-why" }, item.why)),
      sure.length ? sureToggle(error) : ""),
    error,
    el("div", { class: "actions answers" },
      el("button", { type: "button", onclick: () => reply(item, { answer: "no" }, error) }, "No"),
      el("button", { type: "button", class: "different", onclick: () => pickDifferent(item) }, "Different chip"),
      el("button", { type: "button", class: "yes", onclick: () => reply(item, { answer: "yes" }, error) }, "Yes")));
}

// On the matching screen, collapsed under the item: what Claude matched on its own, with Undo.
function sureToggle(errorNode) {
  const list = el("div", { id: "sure-list" });
  const title = () => sureOpen ? "Hide what Claude matched on its own" : `Claude matched ${sure.filter((item) => !item.undone).length} more on its own ›`;
  const toggle = el("button", { type: "button", "aria-controls": "sure-list" });
  const redraw = () => {
    list.replaceChildren(sureList(errorNode, redraw));
    list.hidden = !sureOpen;
    toggle.textContent = title();
    toggle.setAttribute("aria-expanded", String(sureOpen));
  };
  toggle.addEventListener("click", () => { sureOpen = !sureOpen; redraw(); });
  redraw();
  return el("div", { class: "sure-toggle" }, toggle, list);
}

function pickDifferent(item) {
  let picked = null;
  const error = el("p", { class: "error", role: "alert" });
  const save = el("button", { type: "button", class: "count" }, "Count it");
  const chips = matchReasons.map((reason) => {
    const chip = el("button", { type: "button", class: "chip", "aria-pressed": "false" }, reason);
    chip.addEventListener("click", () => {
      picked = picked === reason ? null : reason;  // one chip: the one they meant
      for (const other of chips) other.setAttribute("aria-pressed", String(other === chip && picked !== null));
      save.textContent = picked ? `Count as ${picked}` : "Count it";
      error.textContent = "";
    });
    return chip;
  });
  const close = () => { backdrop.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (event) => { if (event.key === "Escape") close(); };
  save.addEventListener("click", async () => {
    if (!picked) { error.textContent = "Pick the one you meant."; return; }
    if (await reply(item, { answer: "different", reason: picked }, error)) close();
  });
  const sheet = el("div", { class: "sheet pick", role: "dialog", "aria-modal": "true", "aria-labelledby": "which" },
    el("h2", { id: "which" }, "Which one did you mean?"),
    el("p", { class: "sheet-note" }, `“${item.note}”`),
    el("div", { class: "chips" }, ...chips), error,
    el("div", { class: "sheet-actions" }, el("button", { type: "button", onclick: close }, "Cancel"), save));
  const backdrop = el("div", { class: "sheet-backdrop" }, sheet);
  backdrop.addEventListener("click", (event) => { if (event.target === backdrop) close(); });
  document.addEventListener("keydown", onKey);
  document.body.append(backdrop);
  chips[0]?.focus();
}

// One answer to one match. True once the item is done with: answered, or out of date and dropped.
async function reply(item, body, errorNode) {
  if (busy) return false;  // a double tap must not answer twice
  busy = true;
  try {
    const result = await api(`/api/matches/${encodeURIComponent(item.id)}`, { method: "POST", body: JSON.stringify(body) });
    if (result.status === 401) { tokenProblem(); return false; }
    // Swiped again, or its check is gone: no longer a question, so it leaves quietly.
    if (result.status === 409 || result.status === 404) {
      status.textContent = "That one is out of date, so it was skipped.";
      done(item);
      return true;
    }
    if (!result.ok) {
      // A failed save keeps the item, so the grader can try again; a refusal says what was wrong.
      errorNode.textContent = result.status === 400 ? result.body.error : "Couldn’t save, try again.";
      return false;
    }
    const counted = body.answer !== "no";
    if (counted) checking.counted += 1; else checking.kept += 1;
    const text = counted ? `✓ Counts as ${(body.reason ? [body.reason] : item.reasons).join(" + ")}` : "Kept as an idea for a new check";
    status.textContent = text;
    showToast(text, counted ? "var(--ws-accent)" : "var(--ws-muted)");
    done(item);
    return true;
  } catch {
    errorNode.textContent = "Couldn’t save, try again.";
    return false;
  } finally {
    busy = false;
  }
}

function done(item) {
  checking.left = checking.left.filter((other) => other !== item);
  matches = matches.filter((other) => other.id !== item.id);
  renderMatch();
}

function allChecked() {
  const { counted, kept } = checking;
  showMessage("All checked", `Thanks. ${counted} now count toward a check. ${kept} kept as ${kept === 1 ? "an idea" : "ideas"} for a new check.`,
    el("div", { class: "actions", style: "grid-template-columns: 1fr" }, el("button", { type: "button", class: "good", onclick: backToCards }, "Back to cards")));
}

function backToCards() {
  later = true;  // what's left waits behind the badge
  render();
}

backButton.addEventListener("click", backToCards);
badge.addEventListener("click", openMatching);

renameButton.addEventListener("click", () => {
  grader = null;
  matches = [];  // the last grader's, not the next one's
  sure = [];
  updateBadge();
  try { localStorage.removeItem("ws-grader"); } catch {}
  askName();
});

load();
</script>
</body>
</html>
