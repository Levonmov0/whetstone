[project]
name = "whetstone"
version = "0.1.0"
description = "Test-driven prompt optimization, as a Claude Code plugin"
requires-python = ">=3.12"
dependencies = ["anthropic", "python-dotenv"]

[project.scripts]
whetstone = "whetstone.entry.cli:main"

[dependency-groups]
dev = ["pytest", "pyright", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
